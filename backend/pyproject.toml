[project]
name = "qadoc"
version = "0.1.0"
description = "Modular Document QA Assistant with MongoDB Atlas Vector Search, Jina AI, and Groq GPT-OSS-20B"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "pymongo>=4.6.0",
    "langchain>=1.4.0",
    "langchain-core>=1.5.0",
    "langchain-community>=0.4.0",
    "langchain-groq>=1.1.0",
    "langchain-mongodb>=0.12.0",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.2.0",
    "pypdf>=6.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "requests>=2.30.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
